<!DOCTYPE html>
    {% load static %}
    <html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="{% static 'css/styles.css' %}" rel="stylesheet" />
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet" />
    <title>{% block title %}Home{% endblock %}</title>
  </head>
  <script src="{% static 'bootstrap/bootstrap-5.3.5-dist/js/bootstrap.bundle.min.js' %}">
</script>
  <body>
    <div class="container">
      <header class="topbar">
        <nav class="nav" aria-label="Main navigation">
          <img class="logo-icon" src="{% static 'img/pokemon_logo.png' %}" alt="Pokemon Logo" />
          <text class="logo-text">PokeDatabase</text>
          <a href="{% url 'home' %}"
            class="{% if request.resolver_match.url_name == 'home' %}active{% endif %}">Home</a>
          <a href="{% url 'pokedex' %}"
            class="{% if request.resolver_match.url_name == 'pokedex' %}active{% endif %}">Pokémon</a>
          <a href="{% url 'types' %}"
            class="{% if request.resolver_match.url_name == 'types' %}active{% endif %}">Types</a>
          <a href="{% url 'region' %}"
            class="{% if request.resolver_match.url_name == 'region' %}active{% endif %}">Region</a>
          <a href="{% url 'abilities' %}"
            class="{% if request.resolver_match.url_name == 'abilities' %}active{% endif %}">Abilities</a>
          <a href="{% url 'moves' %}"
            class="{% if request.resolver_match.url_name == 'moves' %}active{% endif %}">Moves</a>
          <a href="{% url 'competitive' %}"
            class="{% if request.resolver_match.url_name == 'competitive' %}active{% endif %}">Competitive</a>
        </nav>
      </header>
    </div>
    
    <main>
      {% block content %}
        <h1>{% block header_text %}{% endblock %}</h1>
      {% endblock %}
    </main>

    <footer>
      <p>© 2025 PokeDatabase</p>
    </footer>
  </body>
</html>
