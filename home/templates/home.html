{% extends 'base.html' %}

{% block title %}Home{% endblock %}

{% block content %}
    <div class="home-grid">
      <div class="home-left">
        <h1 class="hero-title">
          Explore the <span class="hero-title-highlight">Complete</span><br>Pokémon Database
        </h1>
        <p class="text-base">
          Search Pokémon, discover abilities, compare stats, and analyze competitive data — all in one professional platform.
        </p>
        <form class="search-form" method="GET" action="{% url 'search' %}">
          <div class="search-field">
            <span class="search-icon">🔍</span>
            <input class="search-input" type="text" name="search" placeholder="Search Pokémon by name, type, ability...">
            <button class="search-button" type="submit">Search</button>
          </div>
        </form>
      </div>
      <aside class="home-right">
        
      </aside>
    </div>
{% endblock %}
